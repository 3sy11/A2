# A2 Agent Framework — default configuration
# Issue: 20260826-a2-redesign

# Protocols are regular bollydog services and are referenced by domain.alias.
["adapters.scripted_chat"]
module = "a2.protocols.impl.ScriptedChatProtocol"
default_response = "Hello from A2."

["adapters.hash_embedding"]
module = "a2.protocols.impl.HashEmbeddingProtocol"
dimension = 16

["adapters.permission"]
module = "a2.protocols.impl.RulePermissionProtocol"

["adapters.workspace"]
module = "a2.protocols.impl.LocalSandboxProtocol"
root = ".a2/workspace"

["adapters.knowledge"]
module = "a2.protocols.impl.InMemoryVectorProtocol"

["adapters.session"]
module = "bollydog.adapters.memory.MemoryProtocol"

["adapters.plan"]
module = "bollydog.adapters.memory.MemoryProtocol"

["adapters.memory"]
module = "bollydog.adapters.memory.MemoryProtocol"

["adapters.mcp"]
module = "bollydog.adapters.memory.MemoryProtocol"

["adapters.credential"]
module = "bollydog.adapters.memory.MemoryProtocol"

["adapters.team"]
module = "bollydog.adapters.memory.MemoryProtocol"

["adapters.observe"]
module = "bollydog.adapters.memory.MemoryProtocol"

["adapters.schedule"]
module = "bollydog.adapters.memory.MemoryProtocol"

["agent.assistant"]
module = "a2.agent.service.AgentService"
commands = ["commands", "tools"]
depends = ["context.default", "tool.toolkit", "session.store"]
model_ref = "model.chat"
context_ref = "context.default"
tool_ref = "tool.toolkit"
session_ref = "session.store"
plan_ref = "plan.notebook"
system_prompt = "You are a helpful AI assistant built on A2."
tool_groups = ["basic"]
max_iters = 20
subscribe = { "team.*.MessageBroadcast" = "OnMessageBroadcast" }

["agent.assistant".routers]
Reply = ["SSE", "/api/agent/reply"]

["model.chat"]
module = "a2.model.service.ChatModelService"
commands = ["commands"]
protocol = "adapters.scripted_chat"
provider = "scripted"
model = "gpt-4o"
max_retries = 2
context_size = 128000

["model.embed"]
module = "a2.model.service.EmbeddingService"
commands = ["commands"]
protocol = "adapters.hash_embedding"
model = "text-embedding-3-small"
dimension = 16

["context.default"]
module = "a2.context.service.ContextService"
commands = ["commands"]
budget = 128000
trigger_ratio = 0.8
keep_ratio = 0.3

["tool.toolkit"]
module = "a2.tool.service.ToolkitService"
commands = ["commands"]
protocol = "adapters.permission"
depends = ["workspace.local", "mcp.gateway", "credential.vault"]
always_on_groups = ["basic"]
subscribe = { "mcp.*.ServerConnected" = "OnServerConnected", "mcp.*.ServerLost" = "OnServerLost" }

["tool.toolkit".groups]
basic = [
    "workspace.local.ReadPath",
    "workspace.local.ListPath",
    "workspace.local.GlobSearch",
    "workspace.local.GrepSearch",
    "workspace.local.ReadArtifact",
    "agent.assistant.AskHuman",
    "agent.assistant.PresentFiles",
]
edit = ["workspace.local.WritePath", "workspace.local.EditPath"]
exec = ["workspace.local.RunCommand", "workspace.local.RunPython"]
mcp = []

["session.store"]
module = "a2.session.service.SessionService"
commands = ["commands"]
protocol = "adapters.session"
subscribe = { "agent.*.ReplyFinished" = "OnReplyFinished", "agent.*.ReplyParked" = "OnReplyParked" }

["workspace.local"]
module = "a2.workspace.service.WorkspaceService"
commands = ["commands"]
protocol = "adapters.workspace"
root = ".a2/workspace"
exec_timeout = 120

["plan.notebook"]
module = "a2.plan.service.PlanService"
commands = ["commands"]
protocol = "adapters.plan"

["skill.hub"]
module = "a2.skill.service.SkillService"
commands = ["commands"]
skill_dirs = [".a2/skills"]

["memory.longterm"]
module = "a2.memory.service.MemoryService"
commands = ["commands"]
protocol = "adapters.memory"
embed_ref = "model.embed"
subscribe = { "agent.*.ReplyFinished" = "OnReplyFinished" }

["mcp.gateway"]
module = "a2.mcp.service.McpService"
commands = ["commands"]
protocol = "adapters.mcp"

["knowledge.base"]
module = "a2.knowledge.service.KnowledgeService"
commands = ["commands"]
protocol = "adapters.knowledge"
embed_ref = "model.embed"
chunk_size = 800

["credential.vault"]
module = "a2.credential.service.CredentialService"
commands = ["commands"]
protocol = "adapters.credential"

["team.room"]
module = "a2.team.service.TeamService"
commands = ["commands"]
protocol = "adapters.team"

["observe.tracer"]
module = "a2.observe.service.TraceService"
commands = ["commands"]
protocol = "adapters.observe"
subscribe = { "#" = "OnAny" }

["entry.http"]
module = "a2.entrypoint.http.service.HttpEntryService"
commands = ["commands"]

["entry.http".routers]
Chat = ["SSE", "/api/chat/stream"]

["schedule.runner"]
module = "a2.entrypoint.scheduler.service.SchedulerService"
commands = ["commands"]
protocol = "adapters.schedule"
poll_interval = 30.0
