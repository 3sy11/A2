[project]
name = "a2"
version = "0.1.0"
description = "AI Agent framework built on bollydog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bollydog>=0.1.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "fire>=0.5.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.0.0"]
mcp = ["mcp>=1.0.0"]
env = ["aiodocker>=0.21.0", "asyncssh>=2.14.0"]
search = ["bm25s>=0.2.0"]
all = ["litellm>=1.0.0", "mcp>=1.0.0", "aiodocker>=0.21.0", "asyncssh>=2.14.0", "bm25s>=0.2.0"]
